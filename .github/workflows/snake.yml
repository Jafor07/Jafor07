# Setup (one-time):
# 1. In your Jafor07/Jafor07 profile repo, create the folder .github/workflows/
# 2. Save this file there as snake.yml
# 3. Push it to the `main` branch — the Action runs automatically (and every 12h after)
# 4. It generates github-contribution-grid-snake.svg and pushes it to an `output` branch,
#    which is exactly what the <img> tag in README.md points to.

name: generate animated snake

on:
  schedule:
    - cron: "0 */12 * * *"   # runs every 12 hours
  workflow_dispatch: {}       # lets you trigger it manually from the Actions tab
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        id: snake-gif
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
